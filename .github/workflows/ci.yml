name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read      # the tests only need to read the code

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pywebview pillow
      - name: Run the tests
        run: python -W ignore -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the phone version's logic against the Python version
        run: node --test mobile/tests/core.test.js mobile/tests/i18n.test.js ui/tests/i18n.test.js
