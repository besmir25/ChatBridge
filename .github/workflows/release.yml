name: Release

# Publish a release by pushing a version tag:   git tag v1.1.0   then   git push origin v1.1.0
# (python bump_version.py 1.1.0 prepares the version and changelog first - see RELEASING.md)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # needed to check which branch the tag belongs to
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Only publish tags that are on the main branch
        shell: bash
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/main$'; then
            echo "Tag $GITHUB_REF_NAME is not on the main branch - refusing to publish a release from it."
            exit 1
          fi

      - name: Install
        run: pip install pywebview==6.2.1 pyinstaller pillow

      - name: Check the tag matches the version inside the app
        shell: python
        run: |
          import os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = re.search(r'VERSION = "([^"]+)"', open("chatbridge_app.py", encoding="utf-8").read()).group(1)
          if tag != ver:
              sys.exit(f"The tag is v{tag} but chatbridge_app.py says VERSION = {ver}. Run bump_version.py, commit, and tag again.")

      - name: Test and build the app, installer and extension
        run: python make_release.py

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then FLAGS="--prerelease"; fi
          FILES="release/ChatBridge-Setup.exe release/ChatBridge-Capture-extension-*.zip release/SHA256SUMS.txt"
          NOTES="release/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          TITLE="ChatBridge ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # a release for this tag was already created by hand on github.com: fill it in instead of failing
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "$TITLE" --notes-file "$NOTES" $FLAGS
          fi

  # macOS: one .dmg for Apple Silicon and one for Intel Macs. Signed and notarized when the Apple secrets exist (see RELEASING.md);
  # without them the .dmg is unsigned and macOS warns on first open. If this fails, the Windows release above stays published.
  mac:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build never needs git access; uploads use GH_TOKEN
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pywebview==6.2.1 pyinstaller pillow
      - name: Put the signing certificate in a temporary keychain
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.HAS_MAC_CERT == 'true'
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -f pkcs12 -k "$KC" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Test and build the .dmg
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python build_unix.py
      - name: Check the app starts
        run: |
          APP=dist/ChatBridge.app/Contents/MacOS/ChatBridge
          test -x "$APP"
          "$APP" & PID=$!; sleep 20
          if kill -0 $PID 2>/dev/null; then echo "still running after 20 s: OK"; kill $PID; else echo "it quit"; cat "$HOME/Library/Application Support/ChatBridge/chatbridge.log" || true; exit 1; fi
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.dmg release/SHA256SUMS-mac-*.txt --clobber

  # Linux: an AppImage (one file that runs on most distributions). Built on the oldest supported Ubuntu so it runs on older systems too.
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build never needs git access; uploads use GH_TOKEN
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 xvfb
          pip install "pywebview[qt]==6.2.1" PyQt6 PyQt6-WebEngine pyinstaller pillow
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -   # a pinned, checked tool
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Test and build the AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: python build_unix.py
      - name: Check the app starts
        run: |
          IMG=$(ls release/*.AppImage)
          chmod +x "$IMG"
          xvfb-run -a "$IMG" & sleep 25
          if pgrep -f "usr/lib/chatbridge/ChatBridge" >/dev/null; then echo "running: OK"; pkill -f "usr/lib/chatbridge/ChatBridge"; else echo "it quit"; cat "$HOME/.config/ChatBridge/chatbridge.log" || true; exit 1; fi
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.AppImage release/SHA256SUMS-linux.txt --clobber

  # The phone app: built on GitHub's Linux machines and attached to the same release. If this fails, the Windows release above stays published.
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and test the shared logic
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          node --test tests/core.test.js tests/i18n.test.js
      - name: Build the .apk
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ChatBridge-Android.apk
          gh release upload "$GITHUB_REF_NAME" ChatBridge-Android.apk --clobber
